<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweatBox connection test</title>
  <style>
    body { background: #0b0c0f; color: #f4f4f6; font: 20px/1.5 system-ui, sans-serif; padding: 24px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>SweatBox connection test</h1>
  <pre id="out">Checking…</pre>
  <script src="config.js"></script>
  <script>
    const out = document.getElementById('out');
    async function check() {
      if (!API_URL) throw new Error('API_URL is empty. Edit web/config.js.');
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    }
    check()
      .then((data) => { out.textContent = 'CONNECTED\n' + JSON.stringify(data, null, 2); })
      .catch((error) => { out.textContent = 'FAILED\n' + error.message; });
  </script>
</body>
</html>
